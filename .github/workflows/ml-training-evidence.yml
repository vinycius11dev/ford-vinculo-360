name: ML training evidence

on:
  push:
    paths:
      - "apps/ml/**"
      - "docs/ia-machine-learning-sprint3.md"
      - ".github/workflows/ml-training-evidence.yml"
  pull_request:
    paths:
      - "apps/ml/**"
      - "docs/ia-machine-learning-sprint3.md"
      - ".github/workflows/ml-training-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-training-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-and-evaluate:
    name: Train, evaluate, and publish synthetic pilot metrics
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ML dependencies
        run: python -m pip install -r apps/ml/requirements-training.txt

      - name: Generate deterministic synthetic dataset
        run: >-
          python apps/ml/generate_training_data.py
          --output apps/ml/data/training_data.csv
          --rows 1200
          --seed 20260913
          --reference-date 2026-09-13
          --missing-rate 0.01

      - name: Tune and train models, then evaluate on the held-out period
        run: >-
          python apps/ml/train.py
          --data apps/ml/data/training_data.csv
          --artifacts-dir apps/ml/artifacts
          --test-fraction 0.2
          --validation-splits 3

      - name: Publish the model comparison in the workflow summary
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path

          metrics_path = Path("apps/ml/artifacts/metrics.json")
          metrics = json.loads(metrics_path.read_text(encoding="utf-8"))
          rows = [
              f"| {name} | {values['roc_auc']:.4f} | {values['precision']:.4f} | "
              f"{values['recall']:.4f} | {values['f1']:.4f} |"
              for name, values in metrics["test_metrics"].items()
          ]
          summary = [
              "## Machine-learning training evidence",
              "",
              f"Selected on chronological validation: **{metrics['selected_model']}**.",
              f"Validation selection rule: {metrics['selection_rule']}",
              "Final holdout metrics (synthetic data; not production performance):",
              "",
              "| Model | ROC-AUC | Precision | Recall | F1 |",
              "| --- | ---: | ---: | ---: | ---: |",
              *rows,
              "",
              f"Dataset: {metrics['data']['train_records']} training rows and "
              f"{metrics['data']['test_records']} chronologically held-out rows.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(summary) + "\n")
          print(json.dumps({"selected_model": metrics["selected_model"], "test_metrics": metrics["test_metrics"]}, ensure_ascii=False))
          PY

      - name: Upload trained model, dataset, and metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ford-ml-training-evidence
          path: |
            apps/ml/data/training_data.csv
            apps/ml/artifacts/churn_model.joblib
            apps/ml/artifacts/metrics.json
          retention-days: 30
